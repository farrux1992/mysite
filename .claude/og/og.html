<!doctype html>
<!-- Havola kartasi rasmi (og-image, 1200×630) manbasi. Yasash: .claude/og/build.sh
     Ranglar style.css'dagi tungi tema tokenlaridan olingan. -->
<html lang="uz">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@300;500;700&display=block">
<style>
  :root {
    --bg: #0b1220;
    --surface: #111a2e;
    --border: #1e2a44;
    --text: #e8edf6;
    --muted: #94a3bd;
    --accent: #f5b544;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { width: 1200px; height: 630px; overflow: hidden; }

  body {
    display: flex;
    align-items: center;
    gap: 64px;
    padding: 72px 80px;
    background: var(--bg);
    color: var(--text);
    font-family: "Work Sans", Arial, sans-serif;
  }

  .text { flex: 1; min-width: 0; }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 30px;
    font-weight: 700;
    letter-spacing: -0.5px;
  }

  .brand svg { width: 24px; height: 24px; color: var(--accent); }

  .pill {
    display: inline-block;
    margin-top: 18px;
    padding: 6px 18px;
    border: 1.5px solid var(--muted);
    border-radius: 999px;
    color: var(--muted);
    font-size: 20px;
    font-weight: 500;
  }

  h1 {
    margin-top: 48px;
    font-size: 64px;
    font-weight: 300;
    line-height: 1.08;
    letter-spacing: -1.5px;
  }

  .bar {
    width: 72px;
    height: 6px;
    margin-top: 36px;
    border-radius: 3px;
    background: var(--accent);
  }

  .photo {
    width: 380px;
    height: 486px;
    flex-shrink: 0;
    border-radius: 28px;
    border: 1px solid var(--border);
    background: var(--surface) url("../../assets/rasm.jpg") center top / cover no-repeat;
  }
</style>
</head>
<body>
  <div class="text">
    <div class="brand">
      Farrux Zuvayitov
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M12 2c.6 4.9 2.9 7.4 8 8-5.1.6-7.4 3.1-8 8-.6-4.9-2.9-7.4-8-8 5.1-.6 7.4-3.1 8-8z"/>
      </svg>
    </div>
    <div class="pill">Marketing | IT | Business Growth</div>
    <h1>G'oyadan natijaga,<br>natijadan o'sishga.</h1>
    <div class="bar"></div>
  </div>
  <div class="photo"></div>
</body>
</html>
